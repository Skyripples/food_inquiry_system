<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="搜尋市售食品的基本商品資訊">
    <title>市售食品查詢系統</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">FOOD DIRECTORY</p>
        <h1>市售食品查詢</h1>
        <p class="intro">輸入商品名稱、品牌或條碼，查找食品的基本資訊。</p>

        <form id="search-form" class="search-form" role="search">
          <label class="sr-only" for="search-input">搜尋食品</label>
          <input
            id="search-input"
            name="query"
            type="search"
            placeholder="輸入商品名稱、品牌或條碼"
            autocomplete="off"
          >
          <button type="submit">搜尋</button>
        </form>
      </header>

      <section class="results-section" aria-labelledby="results-title">
        <div class="results-heading">
          <h2 id="results-title">搜尋結果</h2>
          <span id="result-count" class="result-count" aria-live="polite"></span>
        </div>
        <p id="status-message" class="status-message" role="status">請輸入關鍵字開始搜尋</p>
        <div id="product-results" class="product-results"></div>
      </section>
    </main>

    <script src="nutrition-config.js" defer></script>
    <script src="data-freshness-config.js" defer></script>
    <script src="data-freshness.js" defer></script>
    <script src="product-sources.js" defer></script>
    <script src="product-validation.js" defer></script>
    <script src="product-search.js" defer></script>
    <script src="product-repository.js" defer></script>
    <script src="product-view.js" defer></script>
    <script src="nutrition-view.js" defer></script>
    <script src="results-view.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
